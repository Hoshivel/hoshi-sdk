# 主分支的驗證。
#
# 驗證的正本是 `AGENTS.md` §2 列的那兩層（Go 與 JS）；這裡照它跑，不多也不少。
#
# 本倉庫是公開的，且零相依：`go/go.mod` 永遠沒有 `require` 區塊，
# `js/package.json` 永遠沒有 dependencies。所以這支 workflow **不需要任何
# secret**，fork 送來的 PR 也跑得完整。
name: CI

on:
  push:
    branches: [main]
  # 開了 PR 就在合併前先驗一次，但**草稿不跑**（下面每個 job 的 `if`）。
  # 迭代期間開成 draft，改好再標 ready for review——那一刻才觸發。
  #
  # 這與「工作分支的頻繁推送不該花 CI」並不衝突：沒有開 PR 的分支不會觸發，
  # 開了 PR 但還是草稿的也不會。換到的是**合併前就知道壞了**，
  # 而不是等合併後才發現壞了。
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

# 同一個 PR 上再推一次，就取消前一次還沒跑完的執行，只留最後一顆 commit 的結果。
#
# **`main` 不取消**（所以用 event_name 判斷，不是無條件 true）：那裡的每一次
# 執行都對應一次真的合併，取消掉就沒有任何地方記得那次合併驗過沒有——
# 而那正是加 CI 想消滅的狀態。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  go:
    name: Go SDK
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go/go.mod
          # 零相依，沒有 go.sum 可以當 cache key。
          cache: false

      - run: go build ./...

      - run: go vet ./...

      # `gofmt -l` 對不合格式的檔案是**印出檔名並以 0 結束**，所以直接跑它
      # 永遠是綠的。要讓它會失敗，得自己看輸出是不是空的。
      - name: gofmt -l .（須無輸出）
        run: |
          set -euo pipefail
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then
            echo "::error::以下檔案未經 gofmt："
            echo "$out"
            exit 1
          fi

      - run: go test -race ./...

  js:
    name: JS SDK
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          # 沒有 dependencies 就沒有 lockfile，也就沒有東西可快取。
          # `npm test` 走 Node 內建的 test runner，不需要 `npm install`。
          cache: ""

      - run: npm test

  # **本倉庫是公開的，所以掃描與 `go、js` 同時起跑**，不等它們綠燈。
  #
  # 公開倉庫的 Actions 分鐘數不計費，所以「基礎驗證紅燈時整組 skipped、
  # 省下執行器時間」在這裡換不到任何東西，只換到更晚才知道掃描的結論。
  # 代價要講清楚：建置壞掉時 CodeQL 的 autobuild 與 govulncheck 會吐同一個
  # 編譯錯誤換一種包裝，所以一顆真的紅燈會伴隨幾顆指向同一個根因的紅燈。
  #
  # **私有倉庫維持 `needs:` 那道閘**——那裡的分鐘數要付錢。兩種形狀是刻意的，
  # 不是漂移；判準與理由見 workspace `AGENTS.md` §1.9.1。
  #
  # 掃描本身的定義在 `security.yml`，那支同時還掛著每週排程。
  security:
    # **這一組在 PR 上也跑，但裡面只有 Gitleaks 會動**（裁示 2026-08-16）。
    #
    # 判準是「漏到 `main` 之後要付什麼」：
    #
    # | | 補救 |
    # |---|---|
    # | CodeQL／govulncheck／Trivy | **修程式**，修好就結束 |
    # | **Gitleaks** | 刪掉不夠——憑證已經在 git 歷史裡，**必須輪替** |
    #
    # 前三種在 PR 攔下與在 `main` 攔下代價一樣，所以留在 `main`（省下每個 PR
    # 數分鐘）；Gitleaks 是唯一代價不同的，所以掛回 PR。
    #
    # **閘門下移到被呼叫的那三個 job 上**（`security.yml` 裡各自的
    # `if: github.event_name != 'pull_request'`），不是留在這裡——留在這裡會把
    # Gitleaks 一起關掉。這樣做同時保住了檢查名稱：它仍然是
    # `安全掃描 / Gitleaks`，按名字釘住的分支保護不受影響。
    name: 安全掃描
    # 閘門對公開倉庫也成立了（裁示 2026-08-16）：掃描要先等基礎驗證綠。
    # 取代 workspace decisions/infrastructure/公開倉庫的掃描不經閘門.md
    needs: [go, js]
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read
      # 呼叫端的權限是被呼叫 job 的**上限**，所以這裡要給到聯集。
      # CodeQL 與 Trivy 上傳 SARIF 要 security-events: write；
      security-events: write
      # CodeQL 在**私有倉庫**要讀本次 run 的資訊，少了它掃描全成功、
      # job 卻以 `Resource not accessible by integration` 收場。
      actions: read
    # 掃描要建置本倉庫，而建置可能需要 HOSHIVEL_CI_TOKEN（私有 module）。
    secrets: inherit
